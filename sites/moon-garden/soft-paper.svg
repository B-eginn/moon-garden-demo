<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100">
  <defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".006 .009" numOctaves="3" seed="23" stitchTiles="stitch" result="folds"/>
      <feDiffuseLighting in="folds" surfaceScale="18" diffuseConstant="1" lighting-color="#ffffff" result="relief">
        <feDistantLight azimuth="225" elevation="50"/>
      </feDiffuseLighting>
      <feComponentTransfer in="relief">
        <feFuncR type="linear" slope=".9" intercept="-.19"/>
        <feFuncG type="linear" slope=".9" intercept="-.19"/>
        <feFuncB type="linear" slope=".9" intercept="-.19"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="1400" height="1100" fill="#808080" filter="url(#paper)"/>
</svg>
